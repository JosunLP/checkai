name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # ── Rust ────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build web UI
        working-directory: web
        run: bun run build

      - name: Build Rust binary
        run: cargo build --release

  # ── Frontend ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint · format · typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: TypeScript type-check
        working-directory: web
        run: bun run tsc --noEmit

      - name: ESLint
        working-directory: web
        run: bun run eslint src/

      - name: Prettier
        working-directory: web
        run: bun run prettier --check "src/**/*.{ts,css}"

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Validate desktop app
        working-directory: desktop
        run: bun run check

      - name: Smoke-test desktop packaging (Linux only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop
        run: bun run pack

      # `pack` only proves the app can be bundled. Launch the packaged binary
      # too, so a main-process crash at startup (like the ESM/CommonJS
      # `electron-updater` import that shipped in 1.0.1) fails CI.
      - name: Smoke-test desktop startup (Linux only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop
        env:
          CHECKAI_SMOKE_TEST: "1"
        run: |
          set +e
          timeout 20 xvfb-run -a ./release/linux-unpacked/checkai-desktop --no-sandbox > startup.log 2>&1
          status=$?
          cat startup.log
          if grep -q "Uncaught Exception" startup.log; then
            echo "::error::The packaged desktop app crashed in the main process at startup."
            exit 1
          fi
          if [ "$status" -ne 124 ]; then
            echo "::error::The packaged desktop app exited early (status $status)."
            exit 1
          fi
