name: 🐞 Bug report
description: Report a problem with the CheckAI server, CLI, engine, or clients.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please search the
        existing issues first to avoid duplicates, and never include secrets
        (tokens, passwords) in logs you paste here.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - CLI (play / analyze / bench / export)
        - Server (REST API)
        - WebSocket API
        - Chess engine / analysis (search, evaluation)
        - Web UI
        - Desktop app
        - WASM / npm package
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, API requests, FEN strings, or moves that trigger the bug.
      placeholder: |
        1. Run `checkai analyze --fen "..."`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces, or relevant logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CheckAI version
      description: Output of `checkai version` (or the git commit hash).
      placeholder: "0.8.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment details
      description: Rust version (`rustc --version`); browser/Node version for UI bugs.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps — screenshots, configuration, FEN strings.
